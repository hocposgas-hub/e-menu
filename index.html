<!DOCTYPE html>
<html lang="th">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="icon" type="image/png"
          href="https://cdn-icons-png.flaticon.com/128/16167/16167341.png">

    <title>HOC POS</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        .iframe-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <div class="iframe-wrapper">
        <iframe
            id="app-iframe"
            scrolling="yes"
            allow="autoplay; fullscreen; geolocation"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        // URL ของ Google Apps Script Web App
        const baseGasUrl =
            "https://script.google.com/macros/s/AKfycbxk_oWVjpHZ2fAmwJGh0s5uAF7r48gwV6cP8y7GcZujtPSPWvH2R5pBTW97OeDH0LYAvA/exec";

        // ส่ง Query Parameters ไปยัง Apps Script
        const queryString = window.location.search;

        const iframe = document.getElementById('app-iframe');
        iframe.src = baseGasUrl + queryString;
    </script>
</body>
</html>
