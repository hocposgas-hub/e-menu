<!DOCTYPE html>
<html lang="th">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/16167/16167341.png">

    <!-- Title -->
    <title>MCH-Emanu Pos</title>

    <style>
        /* ล้างค่าขอบ และล็อกหน้าจอไม่ให้เลื่อน */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* กล่องครอบสำหรับซ่อนแถบเทาด้านบนของ Google Apps Script */
        .iframe-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* ปรับระยะดึงขึ้นไปเฉพาะพอดีซ่อนแถบเทา (ประมาณ 40px) และขยายความสูงลงล่าง */
        .iframe-wrapper iframe {
            width: 100%;
            height: calc(100% ); 
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="iframe-wrapper">
        <!-- ไอเฟรมที่จะเปลี่ยน URL ตามพารามิเตอร์อัตโนมัติ -->
        <iframe id="app-iframe" scrolling="yes" allowfullscreen loading="lazy"></iframe>
    </div>

    <script>
        // 1. ลิงก์ Web App หลักของ Google Apps Script คุณ
        var baseGasUrl = "https://script.google.com/macros/s/AKfycbxCJRAA4qVRbXqkTK1_65pzXkqQogLJt3PhFtZ2H2ILP3jaRRa1qHGEsnaO-w7C4__wNQ/exec";

        // 2. ดึงค่า Query Parameters ปัจจุบันของ GitHub Pages (เช่น ?page=staff หรือ ?table=A1)
        var queryString = window.location.search;

        // 3. ประกอบร่างและยัดใส่ src ของ iframe เพื่อส่งต่อให้ฟังก์ชัน doGet(e) ของ Apps Script จัดการต่อ
        document.getElementById('app-iframe').src = baseGasUrl + queryString;
    </script>
</body>
</html>
